<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task dashboard | SPV prototype</title>
<style>
  :root { color-scheme: light; font: 100%/1.5 system-ui, sans-serif; color: #152640; background: #eef3f8; }
  body { margin: 0; }
  main { max-width: 42rem; margin: 4rem auto; padding: 0 1rem; }
  h1, h2, p { margin: 0 0 .6rem; }
  section, dialog { border: 1px solid #cbd7e4; border-radius: 1rem; padding: 1.5rem; background: #fff; }
  section { margin-top: 1.5rem; }
  ul { margin: 1rem 0 0; padding-left: 1.4rem; }
  li + li { margin-top: 1rem; }
  button { font: inherit; font-weight: 650; border: 1px solid #255395; border-radius: .5rem; padding: .45rem .8rem; color: #173d77; background: #f4f7fc; cursor: pointer; }
  li button { margin: .35rem 0 .35rem .55rem; }
  button:focus-visible, h2:focus { outline: 3px solid #1a62c0; outline-offset: 4px; }
  dialog { color: inherit; width: min(27rem, calc(100% - 5rem)); }
  dialog::backdrop { background: #17243db5; }
  .actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.4rem; }
  #confirm-delete { background: #8e222c; border-color: #8e222c; color: #fff; }
  #modal[open] { display: block; }
  .help { color: #445b75; }
</style>
<main>
  <h1>Task dashboard</h1>
  <p class="help">A local dashboard with two sample tasks.</p>
  <section aria-labelledby="tasks-heading">
    <h2 id="tasks-heading" tabindex="-1">Tasks</h2>
    <ul>
      <li id="proposal">Review proposal <button id="delete-proposal">Delete Review proposal</button></li>
      <li>Check budget</li>
    </ul>
  </section>
</main>
<dialog id="modal" aria-labelledby="modal-title" aria-describedby="modal-detail">
  <h2 id="modal-title">Delete task?</h2>
  <p id="modal-detail">Review proposal will be removed from the task list.</p>
  <div class="actions">
    <button id="cancel-delete" autofocus>Cancel</button>
    <button id="confirm-delete">Confirm deletion</button>
  </div>
</dialog>
<script>
  const dialog = document.querySelector('#modal');
  const opener = document.querySelector('#delete-proposal');
  const cancel = document.querySelector('#cancel-delete');
  const confirm = document.querySelector('#confirm-delete');
  const heading = document.querySelector('#tasks-heading');

  opener.addEventListener('click', () => {
    dialog.showModal();
    cancel.focus();
  });
  dialog.addEventListener('keydown', event => {
    if (event.key !== 'Tab') return;
    const first = event.shiftKey ? cancel : confirm;
    if (document.activeElement === first) {
      event.preventDefault();
      (event.shiftKey ? confirm : cancel).focus();
    }
  });
  cancel.addEventListener('click', () => dialog.close());
  confirm.addEventListener('click', () => {
    document.querySelector('#proposal').remove();
    dialog.close();
    heading.focus();
  });
  dialog.addEventListener('close', () => {
    (opener.isConnected ? opener : heading).focus();
  });
</script>
</html>
